name: Phase One evidence campaign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Melakat package without GUI dependencies
        run: python -m pip install -e desktop --no-deps

      - name: Run unit tests before campaign
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Run full Phase One evidence gate
        run: >-
          melakat-phase-one-evidence
          --runs 30
          --ticks 2000
          --seed-start 1
          --output-dir results/phase-one/evidence-gate

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-one-evidence-gate
          path: results/phase-one/evidence-gate
          if-no-files-found: error

      - name: Archive evidence on the current branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase-one/evidence-gate
          if git diff --cached --quiet; then
            echo "Evidence output is already archived."
          else
            git commit -m "[evidence-output] archive Phase One evidence campaign"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
