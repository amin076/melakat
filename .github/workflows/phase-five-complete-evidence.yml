name: Phase Five complete evolvability evidence

on:
  push:
    branches:
      - phase5/gates5c5d-evidence
    paths:
      - ".github/workflows/phase-five-complete-evidence.yml"
      - "experiments/phase-five/**"
      - "scripts/phase_five_evidence.py"
      - "desktop/src/melakat_desktop/phase_five_*.py"
      - "desktop/tests/test_phase_five_*.py"

permissions:
  contents: write

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: phase5/gates5c5d-evidence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless Melakat package
        run: python -m pip install -e desktop --no-deps

      - name: Run all unit tests
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q desktop/src

      - name: Validate Phase Five calibration specification
        run: melakat-experiment validate experiments/phase-five/structural-event-rate-calibration.json

      - name: Run Gate 5C exposure calibration
        run: >-
          melakat-experiment run
          experiments/phase-five/structural-event-rate-calibration.json
          --output-dir results/phase-five/structural-event-rate-calibration

      - name: Select lowest exposure-passing rate and freeze Gate 5D specification
        run: >-
          python scripts/phase_five_evidence.py calibrate
          results/phase-five/structural-event-rate-calibration/campaign.json
          results/phase-five/structural-event-rate-calibration/calibration-decision.json
          experiments/phase-five/variable-genome-full.json

      - name: Commit calibration evidence and frozen full specification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase-five/structural-event-rate-calibration experiments/phase-five/variable-genome-full.json
          git commit -m "Phase 5C: archive calibration and freeze full campaign"
          git push origin HEAD:phase5/gates5c5d-evidence

      - name: Validate frozen Gate 5D specification
        run: melakat-experiment validate experiments/phase-five/variable-genome-full.json

      - name: Run Gate 5D full matched-seed campaign
        run: >-
          melakat-experiment run
          experiments/phase-five/variable-genome-full.json
          --output-dir results/phase-five/variable-genome-full

      - name: Build paired analysis and full evidence verification
        run: >-
          python scripts/phase_five_evidence.py analyze
          results/phase-five/variable-genome-full/campaign.json
          results/phase-five/variable-genome-full

      - name: Rebuild full evidence checksum manifest
        shell: bash
        working-directory: results/phase-five/variable-genome-full
        run: |
          sha256sum campaign.json summary.json validation.json runs.csv comparison.csv provenance.json paired-analysis.json campaign-verification.json merge-readiness.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Commit Gate 5D evidence
        shell: bash
        run: |
          git add results/phase-five/variable-genome-full
          git commit -m "Phase 5D: archive full variable-genome evidence"
          git push origin HEAD:phase5/gates5c5d-evidence

      - name: Upload complete Phase Five evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-five-complete-evidence-${{ github.run_id }}
          path: |
            results/phase-five/structural-event-rate-calibration
            results/phase-five/variable-genome-full
            experiments/phase-five/variable-genome-full.json
          if-no-files-found: error
