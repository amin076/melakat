name: Gareen AI Melakat evolution

on:
  push:
    branches:
      - experiment/gareen-chatgpt-five-generations
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e desktop pytest
      - name: Validate evolutionary boundary
        run: pytest -q desktop/tests/test_gareen_population.py desktop/tests/test_gareen_ai_generation_cycle.py
