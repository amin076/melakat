name: Phase Three atomic evidence postprocess

on:
  push:
    branches:
      - phase3/full-atomic-movement-actuation-evidence
    paths:
      - ".github/workflows/phase-three-atomic-postprocess.yml"

permissions:
  contents: write

jobs:
  postprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4

      - name: Build paired analysis and merge-readiness record
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import statistics
          from pathlib import Path

          root = Path("results/phase-three/movement-actuation-atomic/full")
          verification = json.loads((root / "campaign-verification.json").read_text(encoding="utf-8"))
          validation = json.loads((root / "validation.json").read_text(encoding="utf-8"))

          with (root / "runs.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          control_name = "movement-actuation-atomic-execution-off"
          treatment_name = "movement-actuation-atomic-execution-on"

          by_key = {(row["condition"], int(row["seed"])): row for row in rows}
          seeds = sorted(
              seed for condition, seed in by_key
              if condition == control_name and (treatment_name, seed) in by_key
          )
          if seeds != list(range(1, 31)):
              raise SystemExit(f"expected matched seeds 1..30, got {seeds}")

          def value(row, metric):
              raw = row.get(metric, "")
              return 0.0 if raw in (None, "") else float(raw)

          def paired_metric(metric):
              deltas = {
                  str(seed): value(by_key[(treatment_name, seed)], metric)
                  - value(by_key[(control_name, seed)], metric)
                  for seed in seeds
              }
              values = list(deltas.values())
              mean = statistics.fmean(values)
              if len(values) > 1:
                  sd = statistics.stdev(values)
                  half = 1.96 * sd / math.sqrt(len(values))
              else:
                  half = 0.0
              low, high = mean - half, mean + half
              return {
                  "n": len(values),
                  "mean_treatment_minus_control": mean,
                  "approx_95_interval": [low, high],
                  "interval_crosses_zero": low <= 0.0 <= high,
                  "positive_pairs": sum(v > 0 for v in values),
                  "zero_pairs": sum(v == 0 for v in values),
                  "negative_pairs": sum(v < 0 for v in values),
                  "deltas_by_seed": deltas,
              }

          mechanism_metrics = [
              "movement_operations",
              "movement_nonzero_operations",
              "movement_zero_step_operations",
              "movement_distance",
              "movement_energy_cost",
              "movement_uncommitted_operations",
              "movement_uncommitted_nonzero_operations",
              "movement_uncommitted_distance",
          ]
          population_metrics = [
              "active_population",
              "births",
              "deaths",
              "historical_genotypes",
              "blocked_divisions",
              "mean_local_neighbors",
              "mean_nearest_neighbor_distance",
          ]

          paired = {
              "format": "melakat-phase-three-atomic-movement-paired-analysis-0.1",
              "experiment": "phase-three-movement-actuation-atomic",
              "scientific_question": "With resource geography, hereditary movement availability, movement-step mutation rate, sensing state, and total resource budget held fixed, does executing MOVE_X/MOVE_Y under atomic payment produce realized locomotion without underpaid committed movement, and does this mechanism alone show a clear directional population effect?",
              "causal_contrast": {
                  "control": control_name,
                  "treatment": treatment_name,
                  "resource_distribution": "center_patch",
                  "movement_step_mutation_rate": 0.5,
                  "atomic_movement_payment_enabled_both_conditions": True,
                  "resource_sensing_enabled_both_conditions": False,
                  "only_intended_difference": "MOVE_X/MOVE_Y execution semantics",
              },
              "n_matched_seeds": 30,
              "ticks_per_run": 2000,
              "completed_runs": 60,
              "engine_version": "phase-three-vm-0.3",
              "measurement_version": "phase-three-measurement-0.3",
              "mechanism_metrics": {metric: paired_metric(metric) for metric in mechanism_metrics},
              "selected_population_outcomes": {metric: paired_metric(metric) for metric in population_metrics},
              "claim_boundary": verification["claim_boundary"],
          }
          (root / "paired-analysis.json").write_text(
              json.dumps(paired, indent=2) + "\n", encoding="utf-8"
          )

          mechanism_ok = (
              verification.get("status") == "PASS"
              and validation.get("passed") is True
              and verification.get("treatment_movement_nonzero_operations", 0) > 0
              and verification.get("treatment_movement_distance", 0) > 0
              and verification.get("underpaid_realized_movement_runs") == []
              and verification.get("movement_partition_identity") is True
              and verification.get("reproducibility_identical") is True
          )
          selected_cross_zero = {
              metric: paired["selected_population_outcomes"][metric]["interval_crosses_zero"]
              for metric in population_metrics
          }
          merge = {
              "status": "READY_FOR_MERGE_REVIEW" if mechanism_ok else "NOT_READY",
              "mechanism_gate_passed": mechanism_ok,
              "campaign_status": verification.get("status"),
              "validation_passed": validation.get("passed"),
              "runs": verification.get("runs"),
              "matched_seeds": verification.get("matched_seeds"),
              "engine_version": verification.get("engine_version"),
              "measurement_version": verification.get("measurement_version"),
              "realized_movement_distance": verification.get("treatment_movement_distance"),
              "realized_nonzero_movement_operations": verification.get("treatment_movement_nonzero_operations"),
              "uncommitted_distance": verification.get("treatment_uncommitted_distance"),
              "underpaid_realized_movement_runs": verification.get("underpaid_realized_movement_runs"),
              "max_abs_energy_balance_error": verification.get("max_abs_energy_balance_error"),
              "max_abs_local_resource_balance_error": verification.get("max_abs_local_resource_balance_error"),
              "reproducibility_identical": verification.get("reproducibility_identical"),
              "selected_population_intervals_cross_zero": selected_cross_zero,
              "scientific_interpretation": "Atomic movement execution is mechanically established and conservatively accounted. The selected population/ecological outcomes do not provide a robust directional effect under this movement-only mechanism campaign; this is not evidence of navigation, adaptation, resource seeking, or fitness advantage.",
              "next_gate": "A new sensing-plus-movement experiment may now be designed, but it must preserve the v0.3 atomic movement semantics and use a matched causal contrast before any navigation/adaptation interpretation.",
          }
          (root / "merge-readiness.json").write_text(
              json.dumps(merge, indent=2) + "\n", encoding="utf-8"
          )

          readme = f'''# Phase Three atomic movement-actuation evidence\n\nThis directory archives the full matched-seed evidence campaign for the Phase Three `phase-three-vm-0.3` atomic movement-payment semantics.\n\n## Campaign\n\n- 30 matched seeds;\n- 2 conditions;\n- 2000 ticks per run;\n- 60 completed runs;\n- control: movement execution off;\n- treatment: movement execution on;\n- hereditary movement availability and `mutation.movement_step_rate=0.5` matched in both conditions;\n- resource sensing disabled in both conditions;\n- `world.atomic_movement_payment_enabled=true` in both conditions.\n\n## Mechanical result\n\nThe verification gate passed. The control committed no movement. The treatment committed {verification['treatment_movement_nonzero_operations']:.0f} non-zero movement operations over {verification['treatment_movement_distance']:.1f} distance units and paid {verification['treatment_movement_energy_cost']:.1f} movement-energy units. Four additional non-zero movement attempts ({verification['treatment_uncommitted_distance']:.1f} distance units) were rejected before commit because later execution-energy payment failed. No committed realized movement was underpaid.\n\nMaximum absolute energy-balance error was {verification['max_abs_energy_balance_error']:.2e}; maximum absolute local-resource balance error was {verification['max_abs_local_resource_balance_error']:.2e}; deterministic reproducibility passed.\n\n## Scientific interpretation\n\nThis campaign establishes the **movement execution/accounting mechanism**, not navigation or adaptation. The selected matched population/ecological outcomes have approximate 95% paired intervals that cross zero, so this campaign does not support a robust directional population effect from movement execution alone.\n\nThe result therefore opens the next controlled gate: a sensing-plus-movement experiment can now ask whether information coupled to locomotion changes spatial/resource outcomes. That future experiment must retain the v0.3 atomic-payment semantics and must not pre-program resource seeking.\n\nSee `campaign-verification.json`, `paired-analysis.json`, `merge-readiness.json`, `validation.json`, and `runs.csv` for machine-readable evidence.\n'''
          (root / "README.md").write_text(readme, encoding="utf-8")

          checksum_files = [
              "campaign.json", "summary.json", "validation.json", "runs.csv",
              "comparison.csv", "provenance.json", "campaign-verification.json",
              "paired-analysis.json", "merge-readiness.json", "README.md",
          ]
          lines = []
          for name in checksum_files:
              data = (root / name).read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

          if not mechanism_ok:
              raise SystemExit("atomic evidence is not merge-ready")
          print(json.dumps(merge, indent=2))
          PY

      - name: Commit postprocessed evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase-three/movement-actuation-atomic/full
          git commit -m "Analyze full atomic movement evidence"
          git push origin HEAD:phase3/full-atomic-movement-actuation-evidence
