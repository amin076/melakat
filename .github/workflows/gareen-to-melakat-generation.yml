name: Gareen to Melakat generation handoff

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/gareen-chatgpt-five-generations
    paths:
      - experiments/gareen_ai_generation_cycle.py
      - .github/workflows/gareen-to-melakat-generation.yml

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Melakat
        uses: actions/checkout@v4
        with:
          path: melakat
      - name: Checkout Gareen experiment
        uses: actions/checkout@v4
        with:
          repository: amin076/gareen
          ref: experiment/ai-parent-conjectures-100
          path: gareen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce Gareen generation-2 verified batch
        working-directory: gareen
        run: PYTHONPATH=. python experiments/chatgpt_melakat_generation_2.py
      - name: Install Melakat
        run: pip install -e melakat/desktop
      - name: Run Melakat selection and emit ChatGPT parent handoff
        run: |
          python melakat/experiments/gareen_ai_generation_cycle.py \
            --verified-batch gareen/outputs/gareen_generation_2_verified.json \
            --generation 2 \
            --max-population 20 \
            --energy-input 100 \
            --ticks 5 \
            --output melakat/outputs/generation_2_melakat_handoff.json
      - name: Upload ChatGPT-ready parent handoff
        uses: actions/upload-artifact@v4
        with:
          name: melakat-generation-2-chatgpt-handoff
          path: melakat/outputs/generation_1_melakat_handoff.json
