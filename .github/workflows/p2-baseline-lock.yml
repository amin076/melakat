name: P2 baseline lock

on:
  push:
    branches:
      - feat/p2-1-world-contract

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e desktop --no-deps
      - name: Compute Phase One baseline fingerprint
        run: |
          python - <<'PY'
          import hashlib
          from melakat_desktop.artifacts import canonical_json
          from melakat_desktop.parameters import CORE_SCHEMA
          from melakat_desktop.phase_zero_engine import PhaseZeroEngine

          def normalize(value):
              if isinstance(value, dict):
                  return {
                      key: normalize(item)
                      for key, item in value.items()
                      if key != "config_hash"
                  }
              if isinstance(value, list):
                  return [normalize(item) for item in value]
              return value

          config = CORE_SCHEMA.defaults()
          config["run.max_ticks"] = 2000
          config["run.seed"] = 1
          config["run.emit_snapshots"] = False
          config = CORE_SCHEMA.validate(config)
          engine = PhaseZeroEngine(config, lambda _event: None)
          while not engine.finished:
              engine.step()
          summary = engine.summary()
          projection = normalize(summary)
          digest = hashlib.sha256(canonical_json(projection).encode("utf-8")).hexdigest()
          print(f"P2_BASELINE_NORMALIZED_SHA256={digest}")
          print(f"P2_BASELINE_FINAL_SNAPSHOT_SHA256={hashlib.sha256(canonical_json(summary['final_snapshot']).encode('utf-8')).hexdigest()}")
          PY
