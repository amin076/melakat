name: Python validation

on:
  push:
    branches:
      - main
      - research/phase-one-evidence-gate
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Melakat package without GUI dependencies
        run: python -m pip install -e desktop --no-deps

      - name: Run unit tests
        working-directory: desktop
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q desktop/src
