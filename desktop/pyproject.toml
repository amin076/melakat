[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "melakat-desktop"
version = "0.1.0"
description = "Desktop laboratory interface for the Melakat digital-world simulation"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "pyqtgraph>=0.14",
  "numpy>=2.0"
]

[project.scripts]
melakat-desktop = "melakat_desktop.main:main"
melakat-phase-zero = "melakat_desktop.phase_zero_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
